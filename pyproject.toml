[project]
name = "albertyw"
version = "1.0.0"
dependencies = [
    # Core packages
    "python-dotenv==1.2.3",             # Read environment variables from .env
    "Flask==3.1.3",                     # Web microframework
    "gunicorn==26.2.0",                 # WSGI server
    "syspath==3.0.9",                   # Modify paths

    # Features
    "feedgen==1.0.0",                   # Generate atom feeds
    "flask-sitemap==0.4.0",             # Web sitemaps
    "markdown2==2.5.5",                 # Markdown formatting
    "Pygments==2.20.0",                 # Syntax highlighting support

    # Monitoring/tracking/logging
    "blinker==1.9.0",                   # Dependency of rollbar
    "rollbar==1.4.0",                   # rollbar.com error logging
    "setproctitle==1.3.7",              # Allow gunicorn to set process title
    "varsnap==1.7.0",                   # Test discovery
]

[project.optional-dependencies]
test = [
    # Testing
    "coverage==7.16.0",                 # Test coverage
    "ruff==0.16.5",                     # Python linter
    "aiohttp==3.14.3",                  # Async HTTP client for testing

    # Testing Help
    "titlecase==2.4.1",                 # Used for checking that note titles are title case

    # Types
    "mypy==2.3.1",                      # Type checking
    "types-requests==2.33.0.20260518",  # Type stubs for requests package
]

[tool.bandit]
# Ignore dev-only false positive
skips = ["B104"]

[tool.ruff]
# https://docs.astral.sh/ruff/rules/
lint.select = ["E", "F", "W", "A", "B", "COM", "N", "PLC", "PLE", "PLW"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = [
    ".",
]
omit = [
    ".virtualenv",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]

[tool.setuptools]
py-modules = []
